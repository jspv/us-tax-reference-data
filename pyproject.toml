[project]
name = "us-tax-reference-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.148.0",
    "playwright>=1.64.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pdfplumber>=0.11.10",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
